name: Addtool Source - Lint & Build

on:
  push:
    paths:
      - 'projects/addtool/src/**'
      - 'projects/addtool/package.json'
      - 'projects/addtool/package-lock.json'
      - 'projects/addtool/tsconfig.json'
      - 'projects/addtool/eslint.config.mjs'
      - 'projects/addtool/esbuild.js'
      - '.github/workflows/addtool-src.yml'
  pull_request:
    paths:
      - 'projects/addtool/src/**'
      - 'projects/addtool/package.json'
      - 'projects/addtool/package-lock.json'
      - 'projects/addtool/tsconfig.json'
      - 'projects/addtool/eslint.config.mjs'
      - 'projects/addtool/esbuild.js'
      - '.github/workflows/addtool-src.yml'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: projects/addtool
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.7.0'
          cache: 'npm'
          cache-dependency-path: projects/addtool/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Check types
        run: npm run check-types
      
      - name: Build
        run: npm run compile


