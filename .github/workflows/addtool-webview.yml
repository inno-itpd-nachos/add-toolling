name: Addtool Webview - Lint & Build

on:
  push:
    paths:
      - 'projects/addtool/webview/**'
      - 'projects/addtool/webview/package.json'
      - 'projects/addtool/webview/package-lock.json'
      - 'projects/addtool/webview/tsconfig*.json'
      - 'projects/addtool/webview/eslint.config.js'
      - 'projects/addtool/webview/vite.config.ts'
      - '.github/workflows/addtool-webview.yml'
  pull_request:
    paths:
      - 'projects/addtool/webview/**'
      - 'projects/addtool/webview/package.json'
      - 'projects/addtool/webview/package-lock.json'
      - 'projects/addtool/webview/tsconfig*.json'
      - 'projects/addtool/webview/eslint.config.js'
      - 'projects/addtool/webview/vite.config.ts'
      - '.github/workflows/addtool-webview.yml'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: projects/addtool/webview
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.7.0'
          cache: 'npm'
          cache-dependency-path: projects/addtool/webview/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Build
        run: npm run build


